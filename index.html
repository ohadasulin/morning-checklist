<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>הבוקר שלי</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="הבוקר שלי">
<meta name="theme-color" content="#f6ecff">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  @font-face { font-family: "Rubik"; font-weight: 500 800; font-display: swap;
    src: url(fonts/rubik-hebrew.woff2) format("woff2");
    unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: "Rubik"; font-weight: 500 800; font-display: swap;
    src: url(fonts/rubik-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212; }
  :root {
    --ink: #1f2a4d;
    --muted: #6b7393;
    --green: #34c76a;
    --track: #e8e9f0;
    --card: #ffffff;
    --font: "Rubik", "Arial Hebrew", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: linear-gradient(160deg, #e9f0ff 0%, #f6ecff 45%, #fff1f6 100%);
    background-attachment: fixed;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  img { -webkit-user-drag: none; }

  .screen {
    position: fixed; inset: 0;
    padding: calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 28px)
             calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 28px);
    display: none; flex-direction: column;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .screen.active { display: flex; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- List screen ---------- */
  .list-wrap { width: 100%; max-width: 1100px; margin: 0 auto; }
  header.top { display: flex; align-items: center; gap: 20px; margin-bottom: 18px; }
  header.top h1 { font-size: clamp(36px, 5vw, 56px); line-height: 1.02; margin: 0; flex: 1; font-weight: 800; letter-spacing: -.5px; }
  .avatar {
    width: clamp(88px, 12vw, 130px); aspect-ratio: 1; border-radius: 50%;
    object-fit: cover; object-position: 50% 18%;
    border: 5px solid #fff; box-shadow: 0 8px 24px rgba(80, 60, 140, .18);
  }
  .gear { font-size: 30px; width: 52px; height: 52px; border-radius: 50%; opacity: .55; }
  .gear:active { opacity: 1; }

  .progress-card {
    background: var(--card); border-radius: 26px; padding: 18px 24px;
    display: flex; align-items: center; gap: 18px;
    box-shadow: 0 8px 26px rgba(80, 60, 140, .10); margin-bottom: 24px;
  }
  .progress-card .star { font-size: 44px; line-height: 1; }
  .progress-card .text { font-size: 24px; font-weight: 700; color: var(--muted); margin-bottom: 10px; }
  .bar { height: 16px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar > div { height: 100%; width: 0; border-radius: 99px; background: var(--green); transition: width .6s cubic-bezier(.2,.9,.3,1.2); }
  .stars-total { margin-inline-start: auto; text-align: center; font-weight: 800; font-size: 28px; white-space: nowrap; }
  .stars-total small { display: block; font-size: 14px; color: var(--muted); font-weight: 700; }

  .tasks {
    display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  }
  .task {
    position: relative; border-radius: 26px; overflow: hidden; text-align: start;
    background: var(--card); box-shadow: 0 8px 22px rgba(80, 60, 140, .12);
    transition: transform .15s ease;
  }
  .task:active { transform: scale(.97); }
  .task img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; transition: filter .3s; }
  .task .label {
    padding: 14px 18px 16px; padding-inline-end: 64px; font-size: 22px; font-weight: 800; line-height: 1.15; min-height: 72px;
    display: flex; align-items: center;
  }
  .task .check {
    position: absolute; inset-inline-end: 14px; bottom: 18px; width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid #c9cbd8; background: #fff;
    display: grid; place-items: center; color: #fff; font-size: 24px; font-weight: 900;
  }
  .task.done .check { background: var(--green); border-color: var(--green); }
  .task.done img { filter: saturate(.55) brightness(1.05); opacity: .75; }
  .task.done .label { color: var(--muted); }
  .task.done::after {
    content: "⭐"; position: absolute; top: 12px; inset-inline-end: 12px; font-size: 40px;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.2));
  }
  /* soft per-card tints like the sketch */
  .task:nth-child(6n+1) .label { background: #e6f7ec; }
  .task:nth-child(6n+2) .label { background: #fff1e3; }
  .task:nth-child(6n+3) .label { background: #e6efff; }
  .task:nth-child(6n+4) .label { background: #ffe9ef; }
  .task:nth-child(6n+5) .label { background: #f1e9ff; }
  .task:nth-child(6n+6) .label { background: #fff6dc; }

  .task.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  .task.pop .check { animation: pop .5s cubic-bezier(.2,1.6,.4,1) .1s both; }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

  /* ---------- Dialog ---------- */
  .dialog-bg { position: fixed; inset: 0; background: rgba(30, 30, 60, .35); display: none; place-items: center; z-index: 10; }
  .dialog-bg.open { display: grid; }
  .dialog { background: #fff; border-radius: 28px; padding: 28px; width: min(420px, 90vw); text-align: center; }
  .dialog h3 { margin: 0 0 20px; font-size: 26px; }
  .dialog .row { display: flex; gap: 12px; }
  .dialog .row button { flex: 1; padding: 16px; border-radius: 18px; font-size: 20px; font-weight: 800; background: #eef0f6; }
  .dialog .row button.danger { background: #ff5d7a; color: #fff; }

  @media (max-width: 600px) {
    .tasks { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .task .label { font-size: 18px; padding: 12px 14px; padding-inline-end: 52px; min-height: 60px; }
    .task .check { width: 32px; height: 32px; font-size: 18px; inset-inline-end: 10px; bottom: 14px; }
    .stars-total { display: none; }
  }
</style>
</head>
<body>

<!-- List -->
<section class="screen active" id="list">
  <div class="list-wrap">
    <header class="top">
      <h1>רשימת<br>הבוקר שלי</h1>
      <img class="avatar" src="images/ready.jpg" alt="">
      <button class="gear" id="gear" aria-label="הגדרות">⚙️</button>
    </header>
    <div class="progress-card">
      <div class="star">⭐</div>
      <div style="flex:1">
        <div class="text" id="progressText"></div>
        <div class="bar"><div id="progressBar"></div></div>
      </div>
      <div class="stars-total"><span id="starsTotal">0</span><small>כוכבים</small></div>
    </div>
    <div class="tasks" id="tasks"></div>
  </div>
</section>

<canvas id="confetti"></canvas>

<div class="dialog-bg" id="dialog">
  <div class="dialog">
    <h3>להתחיל את הבוקר מחדש?</h3>
    <div class="row">
      <button id="cancelReset">לא</button>
      <button class="danger" id="confirmReset">כן, לאפס</button>
    </div>
  </div>
</div>

<script>
// Edit this list to change tasks / order.
const TASKS = [
  { id: "breakfast",    title: "לאכול" },
  { id: "wash-face",    title: "לנקות פנים וידיים" },
  { id: "charger",      title: "להוריד זמזם" },
  { id: "pajamas-off",  title: "להתלבש" },
  { id: "fold-pajamas", title: "לשים פיג׳מה במיטה" },
  { id: "braid-hair",   title: "תסרוקת" },
  { id: "sunscreen",    title: "קרם הגנה" },
  { id: "shoes",        title: "נעליים" },
];

const STORE_KEY = "morning-checklist-v1";
const today = () => new Date().toLocaleDateString("en-CA");

function load() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) {}
  if (s.date !== today()) { s.date = today(); s.done = []; }
  s.stars = s.stars || 0;
  return s;
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

let state = load();
const $ = (id) => document.getElementById(id);

function renderList(popId) {
  state = load(); // new day → fresh list
  const doneCount = TASKS.filter((t) => state.done.includes(t.id)).length;
  $("progressText").textContent = doneCount === TASKS.length
    ? "סיימתי הכל! 🎉"
    : `סיימתי ${doneCount} מתוך ${TASKS.length}`;
  $("progressBar").style.width = (doneCount / TASKS.length * 100) + "%";
  $("starsTotal").textContent = state.stars;

  $("tasks").innerHTML = "";
  for (const t of TASKS) {
    const done = state.done.includes(t.id);
    const b = document.createElement("button");
    b.className = "task" + (done ? " done" : "") + (t.id === popId ? " pop" : "");
    b.innerHTML = `<img src="images/${t.id}.jpg" alt=""><div class="label">${t.title}</div><div class="check">${done ? "✓" : ""}</div>`;
    b.onclick = () => toggle(t, b);
    $("tasks").appendChild(b);
  }
}

function toggle(t, card) {
  if (state.done.includes(t.id)) {
    state.done = state.done.filter((id) => id !== t.id);
    state.stars = Math.max(0, state.stars - 1);
    save(); renderList();
    return;
  }
  state.done.push(t.id);
  state.stars++;
  save();
  const r = card.getBoundingClientRect();
  renderList(t.id);
  burst(r.left + r.width / 2, r.top + r.height / 2, 260);
  rain(150);
  if (TASKS.every((t) => state.done.includes(t.id))) {
    // Finale: extra bursts and a big shower.
    setTimeout(() => burst(innerWidth * 0.15, innerHeight * 0.8, 250), 300);
    setTimeout(() => burst(innerWidth * 0.85, innerHeight * 0.8, 250), 550);
    setTimeout(() => burst(innerWidth * 0.5, innerHeight * 0.4, 300), 800);
    setTimeout(() => rain(450), 900);
  }
}

// ---------- Confetti (canvas) ----------
const canvas = $("confetti"), ctx = canvas.getContext("2d");
const COLORS = ["#ff8fb1", "#ffd23f", "#7bd389", "#6fb6ff", "#b38cff", "#ffa46b", "#ff5d7a"];
let pieces = [], running = false;

function resize() {
  const d = window.devicePixelRatio || 1;
  canvas.width = innerWidth * d; canvas.height = innerHeight * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener("resize", resize); resize();

function addPiece(x, y, vx, vy) {
  pieces.push({
    x, y, vx, vy,
    w: 8 + Math.random() * 8, h: 12 + Math.random() * 10,
    rot: Math.random() * 6.28, vr: (Math.random() - .5) * .4, tilt: Math.random() * 6.28,
    color: COLORS[Math.floor(Math.random() * COLORS.length)], round: Math.random() < .25,
  });
}
function burst(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 8 + Math.random() * 16;
    addPiece(x, y, Math.cos(a) * s, Math.sin(a) * s - 10);
  }
  start();
}
function rain(n) {
  for (let i = 0; i < n; i++) {
    addPiece(Math.random() * innerWidth, -20 - Math.random() * innerHeight, (Math.random() - .5) * 4, 2 + Math.random() * 4);
  }
  start();
}
function start() { if (!running) { running = true; requestAnimationFrame(tick); } }
function tick() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of pieces) {
    p.vx *= .97; p.vy = p.vy * .97 + .25;
    p.tilt += .1; p.rot += p.vr;
    p.x += p.vx + Math.sin(p.tilt) * .8; p.y += p.vy;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.tilt));
    ctx.fillStyle = p.color;
    if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, 7); ctx.fill(); }
    else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
  pieces = pieces.filter((p) => p.y < innerHeight + 40);
  if (pieces.length) requestAnimationFrame(tick);
  else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}

$("gear").onclick = () => $("dialog").classList.add("open");
$("cancelReset").onclick = () => $("dialog").classList.remove("open");
$("confirmReset").onclick = () => {
  state.done = []; save();
  $("dialog").classList.remove("open");
  renderList();
};
// Refresh when the app comes back to the foreground (e.g. next morning).
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) renderList();
});

renderList();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
